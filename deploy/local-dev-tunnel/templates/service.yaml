{{- $fullName := include "fullName" . -}}
# Public-facing service: only signaling and media ports
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ include "namespace" . }}
  labels:
    app: {{ $fullName }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.publicIp }}
  loadBalancerIP: {{ .Values.service.publicIp }}
  {{- end }}
  ports:
  - name: https
    port: {{ .Values.service.httpsPort }}
    targetPort: signaling
    protocol: TCP
  - name: media
    port: {{ .Values.service.mediaPort }}
    targetPort: media
    protocol: TCP
  selector:
    app: {{ $fullName }}
---
# Internal SSH service: reachable only via kubectl port-forward
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-ssh
  namespace: {{ include "namespace" . }}
  labels:
    app: {{ $fullName }}
spec:
  type: ClusterIP
  ports:
  - name: ssh
    port: {{ .Values.ssh.port }}
    targetPort: ssh
    protocol: TCP
  selector:
    app: {{ $fullName }}
