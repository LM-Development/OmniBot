{{- $fullName := include "fullName" . -}}
{{- $namespace := include "namespace" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-routing
  namespace: {{ $namespace }}
  labels:
    helmVersion: {{ .Chart.Version }}
    helmAppVersion: {{ .Chart.AppVersion }}
    helmName: {{ .Chart.Name }}
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  clusterIP: None
  ports:
  - name: public
    port: 443
    targetPort: 81
  selector:
    app: {{ $fullName }}
